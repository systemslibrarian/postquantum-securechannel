name: Release

# Publishes the three packages when a v* tag is pushed. Everything here is designed so a consumer can
# independently verify what they installed:
#   - the build runs the full test suite on all three TFMs before anything is packed;
#   - a CycloneDX SBOM is generated and attached to the GitHub release;
#   - GitHub build-provenance attestations are produced for every .nupkg (verifiable with `gh attestation verify`);
#   - packages are pushed to NuGet.org via Trusted Publishing (short-lived OIDC token, no long-lived API key).
#
# One-time NuGet.org setup for Trusted Publishing (no secret to store):
#   nuget.org → account → Trusted Publishing → add a policy for this repo
#   (owner: systemslibrarian, repo: postquantum-securechannel, workflow: release.yml).
# See RELEASING.md for the full checklist.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach the GitHub release to (e.g. v1.0.0). The package version comes from the .csproj regardless.'
        required: false
        default: ''

permissions:
  contents: write      # create the GitHub release and upload assets
  id-token: write      # OIDC token for NuGet Trusted Publishing + attestations
  attestations: write  # build-provenance attestations for the packages

env:
  # On a tag push this is the pushed tag; on manual dispatch it is the optional `tag` input.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build, verify, pack, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SourceLink and deterministic builds need full history

      # Fail before anything is packed if the version documented to users has drifted from the
      # tag being published. This workflow takes the package version from the .csproj, so without
      # this nothing checks that the tag, the three packages, and the install snippets agree.
      # The equivalent gate in postquantum-file-encryption rejected a v1.7.0 tag over exactly this
      # class of mismatch before anything reached nuget.org; postquantum-aspnetcore lacked the
      # snippet half of it and shipped three releases telling users to install 0.8.0-preview.1.
      - name: Verify documented versions match the release tag
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          echo "Release tag version: ${version}"
          fail=0

          # 1. Every packable project must declare exactly the tag version — the three ship in lockstep.
          while IFS= read -r csproj; do
            declared="$(grep -oPm1 '(?<=<Version>)[^<]+' "$csproj" || true)"
            if [ -n "$declared" ] && [ "$declared" != "$version" ]; then
              echo "::error file=$csproj::<Version> is '$declared' but the release tag is '$version'"
              fail=1
            fi
          done < <(git ls-files '*.csproj')

          # 2. Every 'dotnet add package … --version X.Y.Z' snippet in tracked Markdown must pin the
          #    tag. Package READMEs ship inside the .nupkg, so these are what consumers read on
          #    nuget.org. CHANGELOG.md is excluded — version mentions there are facts about earlier
          #    releases, not instructions.
          while IFS= read -r hit; do
            file="${hit%%:*}"
            pinned="$(printf '%s' "$hit" | grep -oP -- '--version \K[0-9][0-9A-Za-z.-]*')"
            if [ "$pinned" != "$version" ]; then
              echo "::error file=$file::install snippet pins '--version $pinned' but the release tag is '$version'"
              fail=1
            fi
          done < <(git grep -nP -- '--version [0-9]' -- '*.md' ':!CHANGELOG.md' || true)

          if [ "$fail" -ne 0 ]; then
            echo "Version drift detected — sweep the docs to ${version} before tagging." >&2
            exit 1
          fi
          echo "All project and documentation versions match ${version}."

      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release, warnings as errors)
        run: dotnet build --configuration Release --no-restore

      # Gate the release on the full suite — including the public-API freeze guard — on every TFM.
      - name: Test (net8.0)
        run: dotnet test --configuration Release --no-build --framework net8.0
      - name: Test (net9.0)
        run: dotnet test --configuration Release --no-build --framework net9.0
      - name: Test (net10.0)
        run: dotnet test --configuration Release --no-build --framework net10.0

      - name: Pack
        run: |
          for proj in \
            src/PostQuantum.SecureChannel/PostQuantum.SecureChannel.csproj \
            src/PostQuantum.SecureChannel.AspNetCore/PostQuantum.SecureChannel.AspNetCore.csproj \
            src/PostQuantum.SecureChannel.Testing/PostQuantum.SecureChannel.Testing.csproj; do
            dotnet pack "$proj" --configuration Release --no-build -o ./artifacts
          done
        env:
          CI: 'true'

      - name: Generate SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet-CycloneDX PostQuantum.SecureChannel.slnx -o ./artifacts -F Json -fn sbom.cyclonedx.json -t

      - name: Attest build provenance for packages
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: './artifacts/*.nupkg'

      - name: Create GitHub release
        if: ${{ env.RELEASE_TAG != '' && startsWith(env.RELEASE_TAG, 'v') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/sbom.cyclonedx.json

      # Trusted Publishing: exchanges the workflow's OIDC token for a short-lived NuGet API key.
      # No NUGET_API_KEY secret is stored anywhere. Requires the one-time nuget.org policy above.
      - name: Authenticate to NuGet (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: systemslibrarian

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

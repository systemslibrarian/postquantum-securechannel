name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Install every targeted runtime so all three target frameworks actually execute under test,
      # not just compile. The SDK (last entry) drives the build.
      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release, warnings as errors)
        run: dotnet build --configuration Release --no-restore

      - name: Test on net8.0
        run: dotnet test --configuration Release --no-build --framework net8.0 --verbosity normal

      - name: Test on net9.0
        run: dotnet test --configuration Release --no-build --framework net9.0 --verbosity normal

      - name: Test on net10.0
        run: dotnet test --configuration Release --no-build --framework net10.0 --verbosity normal

  pack:
    name: Pack (validate NuGet metadata)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SourceLink needs full history

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack core
        run: dotnet pack src/PostQuantum.SecureChannel/PostQuantum.SecureChannel.csproj --configuration Release -o ./artifacts

      - name: Pack AspNetCore
        run: dotnet pack src/PostQuantum.SecureChannel.AspNetCore/PostQuantum.SecureChannel.AspNetCore.csproj --configuration Release -o ./artifacts

      - name: Pack Testing
        run: dotnet pack src/PostQuantum.SecureChannel.Testing/PostQuantum.SecureChannel.Testing.csproj --configuration Release -o ./artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

  formal-model:
    name: Formal model (ProVerif, advisory)
    runs-on: ubuntu-latest
    # Advisory until the model is confirmed: this surfaces the real ProVerif result on every push
    # without blocking the build on a model that is not yet verified (see formal/README.md).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ProVerif
        run: |
          sudo apt-get update
          sudo apt-get install -y opam
          opam init --disable-sandboxing --yes
          opam install --yes proverif

      - name: Verify the handshake model
        run: |
          eval "$(opam env)"
          proverif formal/xwing-handshake.pv

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Test with coverage (net8.0)
        run: dotnet test --configuration Release --framework net8.0 --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage/**/coverage.cobertura.xml

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install every targeted runtime so all three target frameworks actually execute under test,
      # not just compile. The SDK (last entry) drives the build.
      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release, warnings as errors)
        run: dotnet build --configuration Release --no-restore

      - name: Test on net8.0
        run: dotnet test --configuration Release --no-build --framework net8.0 --verbosity normal

      - name: Test on net9.0
        run: dotnet test --configuration Release --no-build --framework net9.0 --verbosity normal

      - name: Test on net10.0
        run: dotnet test --configuration Release --no-build --framework net10.0 --verbosity normal

  pack:
    name: Pack (validate NuGet metadata)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SourceLink needs full history

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack src/PostQuantum.SecureChannel/PostQuantum.SecureChannel.csproj --configuration Release -o ./artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
